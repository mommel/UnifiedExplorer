name: Forbid ghpages to be a pull request

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  block-ghpages-pr:
    name: Block PRs from ghpages
    runs-on: ubuntu-latest

    if: github.event.pull_request.head.ref == 'ghpages'

    steps:
      - name: Close PR from ghpages
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
        run: |
          gh pr review "$PR_NUMBER" --request-changes --body "not allowed"
          gh pr close "$PR_NUMBER" \
            --repo "$REPO" \
            --comment "This pull request was automatically closed because PRs from \`$HEAD_BRANCH\` into \`$BASE_BRANCH\` are not allowed."