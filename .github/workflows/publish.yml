name: .NET Desktop Publish Self-Contained

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore

      - name: Publish Windows x64 Self-Contained EXE
        run: dotnet publish --configuration Release --runtime win-x64 --self-contained true --output publish

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-self-contained
          path: publish