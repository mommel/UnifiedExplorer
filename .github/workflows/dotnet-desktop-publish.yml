name: .NET Desktop Publish

on:
  push:
    branches: [ "main" ]

jobs:
  publish:
    runs-on: windows-latest

    permissions:
      contents: write   # needed to create GitHub releases

    env:
      PROJECT_PATH: ./UnifiedExplorer.csproj
      PUBLISH_DIR: ./publish
      SELFCONTAINED: false
      BASE64_ENCODED_PFX: ${{ secrets.Base64_Encoded_Pfx }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore $env:PROJECT_PATH

      - name: Publish Windows x64 EXE
        run: dotnet publish $env:PROJECT_PATH --configuration Release --runtime win-x64 --self-contained $env:SELFCONTAINED --output $env:PUBLISH_DIR

      - name: Decode signing certificate
        if: ${{ env.BASE64_ENCODED_PFX != '' }}
        shell: pwsh
        run: |
          $pfxBytes = [System.Convert]::FromBase64String("${{ secrets.Base64_Encoded_Pfx }}")
          [System.IO.File]::WriteAllBytes("signing-cert.pfx", $pfxBytes)

      - name: Find SignTool
        if: ${{ env.BASE64_ENCODED_PFX != '' }}
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match "\\x64\\signtool.exe$" } |
            Sort-Object FullName -Descending |
            Select-Object -First 1

          if (-not $signtool) {
            throw "signtool.exe wurde nicht gefunden."
          }

          "SIGNTOOL_PATH=$($signtool.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Sign EXE
        if: ${{ env.BASE64_ENCODED_PFX != '' }}
        shell: pwsh
        run: |
          $exeFiles = Get-ChildItem $env:PUBLISH_DIR -Filter *.exe -Recurse

          if ($exeFiles.Count -eq 0) {
            throw "Keine EXE-Datei im Publish-Verzeichnis gefunden."
          }

          foreach ($exe in $exeFiles) {
            & "$env:SIGNTOOL_PATH" sign `
              /f "signing-cert.pfx" `
              /p "${{ secrets.Pfx_Key }}" `
              /fd SHA256 `
              /tr "http://timestamp.digicert.com" `
              /td SHA256 `
              "$($exe.FullName)"
          }

      - name: Verify signature
        if: ${{ env.BASE64_ENCODED_PFX != '' }}
        shell: pwsh
        run: |
          $exeFiles = Get-ChildItem $env:PUBLISH_DIR -Filter *.exe -Recurse

          foreach ($exe in $exeFiles) {
            & "$env:SIGNTOOL_PATH" verify /pa /v "$($exe.FullName)"
          }

      - name: Remove signing certificate
        if: ${{ always() && env.BASE64_ENCODED_PFX != '' }}
        shell: pwsh
        run: |
          if (Test-Path "signing-cert.pfx") {
            Remove-Item "signing-cert.pfx" -Force
          }

      - name: Upload EXE artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-x64-release
          path: ${{ env.PUBLISH_DIR }}

      - name: Read project version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: version
        shell: pwsh
        run: |
          [xml]$csproj = Get-Content $env:PROJECT_PATH
          $version = $csproj.Project.PropertyGroup.Version | Select-Object -First 1
          if (-not $version) { $version = "0.0.0" }
          echo "RELEASE_VERSION=v$version" >> $env:GITHUB_OUTPUT

      - name: Zip publish output
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $zipName = "UnifiedExplorer-${{ steps.version.outputs.RELEASE_VERSION }}-win-x64.zip"
          Compress-Archive -Path "$env:PUBLISH_DIR\*" -DestinationPath $zipName
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV

      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.RELEASE_VERSION }}
          name: UnifiedExplorer ${{ steps.version.outputs.RELEASE_VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: ${{ env.ZIP_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
