name: Build WPF Explorer
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 8.0.x
        
    - name: Publish Single Executable
      run: dotnet publish UnifiedExplorer.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/

    - name: Upload Artifact
      uses: actions/upload-artifact@v3
      with:
        name: UnifiedExplorer-Win64
        path: publish/UnifiedExplorer.exe
